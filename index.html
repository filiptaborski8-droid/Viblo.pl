<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viblo – Filmy i Seriale</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="manifest" href="/manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --red: #e50914;
      --dark: #141414;
      --black: #000;
      --gray: #808080;
      --card: #1a1a1a;
      --text: #fff;
      --muted: #b3b3b3;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* NAVBAR */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 4%;
      background: linear-gradient(180deg, rgba(0,0,0,.9) 0%, transparent 100%);
      transition: background .3s;
    }
    .navbar.scrolled { background: var(--black); }
    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      height: 36px;
    }
    .logo img {
      height: 42px;
      width: auto;
      max-width: 150px;
      object-fit: contain;
      display: block;
    }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .search-box {
      display: flex; align-items: center; background: rgba(0,0,0,.6);
      border: 1px solid #555; border-radius: 4px; padding: 6px 12px;
    }
    .search-box input {
      background: transparent; border: none; color: #fff; outline: none;
      width: 160px; margin-left: 8px; font-size: 14px;
    }
    .admin-btn {
      background: transparent; border: 1px solid #888; color: #fff;
      padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
      transition: all .2s; display: flex; align-items: center; gap: 6px;
    }
    .admin-btn:hover, .admin-btn.active {
      background: var(--red); border-color: var(--red);
    }

    /* HERO */
    .hero {
      height: 70vh; min-height: 420px; position: relative;
      background: linear-gradient(to top, var(--dark) 0%, transparent 50%),
                  linear-gradient(to right, rgba(0,0,0,.7) 0%, transparent 60%),
                  #1a1a2e;
      display: flex; align-items: flex-end; padding: 0 4% 80px;
    }
    .hero-content h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 12px; max-width: 600px; }
    .hero-content p { color: var(--muted); max-width: 480px; line-height: 1.5; margin-bottom: 20px; }
    .hero-buttons { display: flex; gap: 12px; }
    .btn-play, .btn-info {
      padding: 10px 24px; border-radius: 4px; font-weight: 600; font-size: 15px;
      border: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .btn-play { background: #fff; color: #000; }
    .btn-play:hover { background: #e6e6e6; }
    .btn-info { background: rgba(109,109,110,.7); color: #fff; }
    .btn-info:hover { background: rgba(109,109,110,.4); }

    /* MAIN */
    .main { padding: 20px 4% 60px; margin-top: -40px; position: relative; z-index: 2; }
    .section-title {
      font-size: 1.3rem; font-weight: 600; margin: 28px 0 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .category-section { margin-bottom: 26px; }
    .category-heading {
      font-size: clamp(1.25rem, 3.4vw, 2rem);
      line-height: 1.2; font-weight: 700; letter-spacing: -.02em;
      margin: 30px 0 16px; padding-left: 2px;
    }
    .category-section:first-child .category-heading { margin-top: 10px; }
    .row {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px;
      scrollbar-width: thin; scrollbar-color: #444 transparent;
    }
    .row::-webkit-scrollbar { height: 6px; }
    .row::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

    /* CARD */
    .card {
      flex: 0 0 180px; width: 180px; min-height: 270px;
      border-radius: 6px; overflow: hidden; background: var(--card);
      cursor: pointer; transition: transform .25s, box-shadow .25s;
      position: relative; display: flex; flex-direction: column;
    }
    .card:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 8px 25px rgba(0,0,0,.6); }
    .card-poster {
      width: 100%; height: 270px; object-fit: cover; background: #222;
      display: block; flex: 0 0 270px;
    }
    .card-poster.placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; color: #777; height: 270px; flex: 0 0 270px;
      background: linear-gradient(145deg, #292929, #111);
    }
    .card-info {
      padding: 10px; position: absolute; bottom: 0; left: 0; right: 0;
      min-height: 64px; display: flex; flex-direction: column; justify-content: flex-end;
      background: linear-gradient(transparent, rgba(0,0,0,.98));
    }
    .modal-poster {
      display: block; width: min(220px, 38%); max-height: 330px;
      object-fit: cover; border-radius: 7px; background: #222;
    }
    .modal-detail-row { display: flex; gap: 20px; align-items: flex-start; }
    .modal-detail-text { flex: 1; min-width: 0; }
    .modal-external { display: inline-block; margin-top: 16px; }
    .embed-note { padding: 12px 18px; color: #aaa; background: #111; font-size: 13px; line-height: 1.5; }
    @media (max-width: 520px) {
      .modal-detail-row { gap: 12px; }
      .modal-poster { width: 34%; max-height: 220px; }
    }
    .card-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ADMIN PANEL */
    .admin-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 2000;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .admin-overlay.show { display: flex; }
    .admin-box {
      background: #1a1a1a; border-radius: 10px; width: 100%; max-width: 640px;
      max-height: 90vh; overflow-y: auto; border: 1px solid #333;
    }
    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 22px; border-bottom: 1px solid #333;
    }
    .admin-header h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
    .close-btn {
      background: none; border: none; color: #aaa; font-size: 1.4rem; cursor: pointer;
    }
    .close-btn:hover { color: #fff; }

    .login-form, .add-form { padding: 22px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 11px 14px; background: #2a2a2a; border: 1px solid #444;
      border-radius: 5px; color: #fff; font-size: 14px; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--red);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-actions { display: flex; gap: 10px; margin-top: 8px; }
    .btn-primary {
      background: var(--red); color: #fff; border: none; padding: 11px 22px;
      border-radius: 5px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .btn-primary:hover { background: #f40612; }
    .btn-secondary {
      background: #333; color: #fff; border: none; padding: 11px 18px;
      border-radius: 5px; cursor: pointer; font-size: 14px;
    }
    .btn-secondary:hover { background: #444; }

    .admin-list { padding: 0 22px 22px; }
    .admin-list h3 { font-size: 1rem; margin-bottom: 12px; color: var(--muted); }
    .admin-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: #222; border-radius: 6px; margin-bottom: 8px;
    }
    .admin-item-info { font-size: 14px; }
    .admin-item-info small { color: var(--muted); display: block; margin-top: 2px; }
    .delete-btn {
      background: transparent; border: 1px solid #666; color: #ff6b6b;
      padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .delete-btn:hover { background: #ff6b6b; color: #fff; border-color: #ff6b6b; }

    /* MODAL PLAYER / DETAILS */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 1500;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #181818; border-radius: 10px; width: 100%; max-width: 860px;
      max-height: 90vh; overflow-y: auto; position: relative;
    }
    .modal-close {
      position: absolute; top: 12px; right: 16px; background: #333; border: none;
      color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
      font-size: 1.1rem; z-index: 5;
    }
    .modal-close:hover { background: #555; }
    .player-wrapper {
      position: relative; width: 100%; padding-top: 56.25%; background: #000;
    }
    .player-wrapper iframe, .player-wrapper video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
    }
    .modal-info { padding: 22px; }
    .modal-info h2 { font-size: 1.6rem; margin-bottom: 8px; }
    .modal-meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
    .modal-desc { line-height: 1.6; color: #ddd; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #333; color: #fff; padding: 12px 24px; border-radius: 6px;
      font-size: 14px; z-index: 3000; opacity: 0; transition: all .3s;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* EMPTY STATE */
    .empty {
      text-align: center; padding: 60px 20px; color: var(--muted);
    }
    .empty i { font-size: 3rem; margin-bottom: 16px; opacity: .4; }
    .empty p { margin-bottom: 20px; }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .card { flex: 0 0 140px; width: 140px; }
      .card-poster, .card-poster.placeholder { height: 210px; }
      .search-box input { width: 100px; }
      .form-row { grid-template-columns: 1fr; }
      .hero { height: 55vh; padding-bottom: 50px; }
    }

    /* DOPASOWANIE DO KOMPUTERÓW, TABLETÓW I TELEFONÓW */
    img, video, iframe { max-width: 100%; }

    .navbar {
      gap: 14px;
      min-height: 64px;
    }
    .logo { flex: 0 1 auto; min-width: 0; }
    .logo img { max-width: min(22vw, 190px); object-fit: contain; }
    .nav-right { min-width: 0; }
    .hero { min-height: 440px; }
    .hero-content { width: min(100%, 760px); }
    .main { width: 100%; }
    .modal-content, .admin-box { min-width: 0; }
    .form-group input, .form-group select, .form-group textarea { min-width: 0; }

    @media (min-width: 1200px) {
      .navbar { padding-left: max(4%, calc((100% - 1440px) / 2)); padding-right: max(4%, calc((100% - 1440px) / 2)); }
      .hero { padding-left: max(4%, calc((100% - 1440px) / 2)); }
      .main { padding-left: max(4%, calc((100% - 1440px) / 2)); padding-right: max(4%, calc((100% - 1440px) / 2)); }
      .card { flex-basis: 200px; width: 200px; }
      .card-poster, .card-poster.placeholder { height: 300px; }
    }

    /* Telefony w trybie „Witryna na komputer” potrafią zgłaszać
       szerokość viewportu ok. 980 px. Dlatego układ mobilny
       uruchamiamy również dla węższych tabletów/telefonów. */
    @media (max-width: 1024px) {
      .navbar {
        padding: 10px 4%;
        align-items: center;
        flex-wrap: wrap;
        row-gap: 9px;
        background: rgba(0,0,0,.94);
      }
      .logo { height: 30px; }
      .logo img { height: 30px; max-width: 34vw; }
      .nav-right {
        flex: 1 1 100%;
        width: 100%;
        justify-content: space-between;
        gap: 8px;
      }
      .search-box { flex: 1 1 auto; min-width: 0; }
      .search-box input { width: 100%; min-width: 0; }
      .admin-btn { flex: 0 0 auto; padding: 8px 10px; font-size: 12px; }
      .hero {
        height: auto;
        min-height: 390px;
        max-height: 620px;
        padding: 120px 5% 54px;
        align-items: flex-end;
      }
      .hero-content h1 { font-size: clamp(1.8rem, 7vw, 2.7rem); overflow-wrap: anywhere; }
      .hero-content p { font-size: 14px; }
      .main { padding: 18px 5% 48px; margin-top: -24px; }
      .section-title { font-size: 1.15rem; }
      .card { flex: 0 0 clamp(132px, 37vw, 170px); width: clamp(132px, 37vw, 170px); }
      .card-poster, .card-poster.placeholder { height: auto; aspect-ratio: 2 / 3; }
      .modal { padding: 10px; }
      .modal-content { max-height: 94vh; }
      .modal-info { padding: 16px; }
      .modal-info h2 { font-size: 1.3rem; padding-right: 32px; }
      .admin-overlay { padding: 10px; }
      .admin-box { max-height: 94vh; }
      .login-form, .add-form { padding: 16px; }
      .admin-list { padding: 0 16px 16px; }
    }

    @media (pointer: coarse) and (max-width: 1100px) {
      .navbar {
        padding: 10px 4%;
        align-items: center;
        flex-wrap: wrap;
        row-gap: 9px;
        background: rgba(0,0,0,.94);
      }
      .logo { height: 30px; }
      .logo img { height: 30px; max-width: 34vw; }
      .nav-right {
        flex: 1 1 100%;
        width: 100%;
        justify-content: space-between;
        gap: 8px;
      }
      .search-box { flex: 1 1 auto; min-width: 0; }
      .search-box input { width: 100%; min-width: 0; }
      .admin-btn { flex: 0 0 auto; padding: 8px 10px; font-size: 12px; }
      .hero {
        height: auto;
        min-height: 390px;
        max-height: 620px;
        padding: 120px 5% 54px;
        align-items: flex-end;
      }
      .hero-content { width: 100%; }
      .hero-content h1 { font-size: clamp(1.8rem, 7vw, 2.7rem); }
      .hero-content p { font-size: 14px; }
      .main { padding: 18px 5% 48px; margin-top: -24px; }
      .section-title { font-size: 1.15rem; }
      .card { flex: 0 0 clamp(132px, 37vw, 170px); width: clamp(132px, 37vw, 170px); }
      .card-poster, .card-poster.placeholder { height: auto; aspect-ratio: 2 / 3; }
      .modal { padding: 10px; }
      .modal-content { max-height: 94vh; }
      .modal-info { padding: 16px; }
      .modal-info h2 { font-size: 1.3rem; padding-right: 32px; }
      .admin-overlay { padding: 10px; }
      .admin-box { max-height: 94vh; }
      .login-form, .add-form { padding: 16px; }
      .admin-list { padding: 0 16px 16px; }
    }

    @media (max-width: 420px) {
      .navbar { padding-left: 3%; padding-right: 3%; }
      .logo img { max-width: 30vw; }
      .nav-right { gap: 6px; }
      .admin-btn { padding: 8px; font-size: 11px; gap: 4px; }
      .search-box { padding: 6px 8px; }
      .search-box input { font-size: 13px; }
      .hero { min-height: 410px; padding-bottom: 44px; }
      .hero-buttons { flex-wrap: wrap; }
      .btn-play, .btn-info { padding: 10px 16px; font-size: 14px; }
      .form-actions { flex-wrap: wrap; }
      .form-actions button { flex: 1 1 120px; }
      .admin-header { padding: 14px 16px; }
      .admin-header h2 { font-size: 1.05rem; }
      .toast { width: calc(100% - 32px); text-align: center; bottom: 16px; padding: 11px 14px; }
    }

    @media (max-width: 340px) {
      .admin-btn { font-size: 10px; }
      .card { flex-basis: 125px; width: 125px; }
    }

  </style>
</head>

  <!-- HERO -->
  <header class="hero" id="hero">
    <div class="hero-content">
      <h1 id="heroTitle">Witaj w Viblo</h1>
      <p id="heroDesc">Twoja prywatna biblioteka filmów i seriali. Dodawaj tytuły przez link i oglądaj kiedy chcesz.</p>
      <div class="hero-buttons">
        <button class="btn-play" onclick="playRandom()"><i class="fas fa-play"></i> Odtwórz</button>
        <button class="btn-info" onclick="document.getElementById('main').scrollIntoView({behavior:'smooth'})">
          <i class="fas fa-list"></i> Biblioteka
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main" id="main">
    <div id="library"></div>
  </main>

  <!-- ADMIN OVERLAY -->
  <div class="admin-overlay" id="adminOverlay">
    <div class="admin-box">
      <div class="admin-header">
        <h2><i class="fas fa-cog"></i> Panel administracyjny</h2>
        <button class="close-btn" onclick="closeAdmin()"><i class="fas fa-times"></i></button>
      </div>

      <!-- LOGIN -->
      <div class="login-form" id="loginForm">
        <div class="form-group">
          <label>E-mail administratora</label>
          <input type="email" id="adminEmail" placeholder="Twój e-mail" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>Hasło</label>
          <input type="password" id="adminPassword" placeholder="Hasło administratora" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" onclick="checkCode()">Zaloguj</button>
        <p style="margin-top:14px;font-size:13px;color:#666">Logowanie zabezpieczone przez Supabase. Konto administratora utwórz w panelu Supabase.</p>
      </div>

      <!-- ADD FORM (hidden until unlocked) -->
      <div id="adminContent" style="display:none">
        <form class="add-form" id="addForm" onsubmit="addItem(event)">
          <div class="form-group">
            <label>Tytuł *</label>
            <input type="text" id="title" required placeholder="np. Breaking Bad">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Typ *</label>
              <select id="type" required onchange="toggleSeriesFields()">
                <option value="movie">Film</option>
                <option value="series">Serial</option>
              </select>
            </div>
            <div class="form-group">
              <label>Rok</label>
              <input type="number" id="year" placeholder="2024" min="1900" max="2030">
            </div>
          </div>
          <div class="form-group">
            <label>Kategoria *</label>
            <select id="category" required>
              <option value="Fantasy">Fantasy</option>
              <option value="Akcja">Akcja</option>
              <option value="Anime">Anime</option>
              <option value="Komedia">Komedia</option>
              <option value="Horror">Horror</option>
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Przygodowe">Przygodowe</option>
              <option value="Dramat">Dramat</option>
              <option value="Thriller">Thriller</option>
              <option value="Dokumentalne">Dokumentalne</option>
              <option value="Inne">Inne</option>
            </select>
          </div>
          <div class="form-row" id="seriesFields" style="display:none">
            <div class="form-group">
              <label>Sezon</label>
              <input type="number" id="season" placeholder="1" min="1">
            </div>
            <div class="form-group">
              <label>Odcinek</label>
              <input type="number" id="episode" placeholder="1" min="1">
            </div>
          </div>
          <div class="form-group">
            <label>Link do wideo * <small style="color:#666">(YouTube, Vimeo lub bezpośredni link .mp4)</small></label>
            <input type="url" id="videoLink" required placeholder="https://www.youtube.com/watch?v=...">
          </div>
          <div class="form-group">
            <label>URL plakatu (opcjonalnie)</label>
            <input type="url" id="poster" placeholder="https://...jpg">
          </div>
          <div class="form-group">
            <label>Opis odcinka / filmu</label>
            <textarea id="description" rows="3" placeholder="Krótki opis..."></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary"><i class="fas fa-plus"></i> Dodaj</button>
            <button type="button" class="btn-secondary" onclick="document.getElementById('addForm').reset(); toggleSeriesFields()">Wyczyść</button>
          </div>
        </form>

        <div class="admin-list">
          <h3>Zarządzaj biblioteką (<span id="count">0</span>)</h3>
          <div id="adminList"></div>
          <div style="margin-top: 18px; text-align: center;">
            <button class="btn-secondary" onclick="logoutAdmin()" style="width:100%">
              <i class="fas fa-lock"></i> Wyloguj z trybu admina
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ========== DATA / SUPABASE ==========
    const SUPABASE_URL = 'https://tmavlymhtkvkhcfxxvab.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_6700yucuhxFIbKjF3cHDYw_KFz_9L0h';
    const TABLE_NAME = 'viblo_library';
    const ROW_ID = 'main';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    let library = [];
    let isAdmin = false;
    let dataReady = false;

    // ========== INIT ==========
    document.addEventListener('DOMContentLoaded', async () => {
      renderLibrary();
      updateHero();
      window.addEventListener('scroll', () => {
        document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
      });
      supabaseClient.auth.onAuthStateChange((_event, session) => {
        isAdmin = !!session?.user;
        updateAdminButton();
        if (isAdmin && document.getElementById('adminOverlay').classList.contains('show')) showAdminContent();
      });
      await loadLibrary();
      supabaseClient.channel('viblo-library-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: TABLE_NAME }, () => loadLibrary())
        .subscribe();
      const { data: { session } } = await supabaseClient.auth.getSession();
      isAdmin = !!session?.user;
      updateAdminButton();
    });

    async function loadLibrary() {
      try {
        const { data, error } = await supabaseClient.from(TABLE_NAME).select('data').eq('id', ROW_ID).maybeSingle();
        if (error) throw error;
        library = Array.isArray(data?.data) ? data.data : [];
        dataReady = true;
        renderLibrary();
        updateHero();
      } catch (error) {
        console.error('Błąd pobierania biblioteki:', error);
        toast('Nie udało się pobrać biblioteki. Sprawdź konfigurację Supabase.');
      }
    }

    async function save() {
      if (!isAdmin) throw new Error('Brak uprawnień administratora.');
      const { error } = await supabaseClient.from(TABLE_NAME).upsert({ id: ROW_ID, data: library }, { onConflict: 'id' });
      if (error) throw error;
    }

    function updateAdminButton() {
      const button = document.getElementById('adminBtn');
      if (!button) return;
      button.classList.toggle('active', isAdmin);
      button.innerHTML = isAdmin ? '<i class="fas fa-unlock"></i> Admin ON' : '<i class="fas fa-lock"></i> Tryb administracji';
    }

    function showAdminContent() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      updateAdminList();
    }

    // ========== RENDER ==========
    function renderLibrary() {
      const container = document.getElementById('library');
      const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      let items = library;
      if (query) {
        items = library.filter(i =>
          (i.title || '').toLowerCase().includes(query) ||
          (i.description || '').toLowerCase().includes(query) ||
          (i.category || 'Inne').toLowerCase().includes(query)
        );
      }

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <i class="fas fa-film"></i>
            <p>${query ? 'Brak wyników wyszukiwania' : 'Biblioteka jest pusta'}<br>
            ${!query ? 'Kliknij „Tryb administracji” i dodaj pierwszy tytuł.' : ''}</p>
          </div>`;
        updateAdminList();
        return;
      }

      // Każdy tytuł trafia do wybranej kategorii. Starsze pozycje bez
      // zapisanej kategorii trafiają do „Inne”.
      const categoryOrder = ['Fantasy', 'Akcja', 'Anime', 'Komedia', 'Horror',
        'Sci-Fi', 'Przygodowe', 'Dramat', 'Thriller', 'Dokumentalne', 'Inne'];
      const categories = [...new Set(items.map(item => item.category || 'Inne'))]
        .sort((a, b) => {
          const ai = categoryOrder.indexOf(a);
          const bi = categoryOrder.indexOf(b);
          return (ai < 0 ? 999 : ai) - (bi < 0 ? 999 : bi) || a.localeCompare(b, 'pl');
        });

      container.innerHTML = categories.map(category => {
        const categoryItems = items.filter(item => (item.category || 'Inne') === category);
        return `
          <section class="category-section">
            <h2 class="category-heading">${escapeHtml(category)}</h2>
            <div class="row">${categoryItems.map(cardHTML).join('')}</div>
          </section>`;
      }).join('');
      updateAdminList();
    }

    function cardHTML(item) {
      const meta = item.type === 'series'
        ? `S${item.season || '?'} E${item.episode || '?'}${item.year ? ' • ' + item.year : ''}`
        : (item.year || 'Film');
      const posterUrl = (item.poster || '').trim();
      const poster = posterUrl
        ? `<img class="card-poster" src="${escapeHtml(posterUrl)}" alt="${escapeHtml(item.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : '';
      const placeholder = `<div class="card-poster placeholder" style="${posterUrl ? 'display:none' : ''}"><i class="fas fa-film"></i></div>`;

      return `
        <div class="card" role="button" tabindex="0" onclick="openItem('${item.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openItem('${item.id}')}">
          ${poster}${placeholder}
          <div class="card-info">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-meta">${escapeHtml(String(meta))} · ${escapeHtml(item.category || 'Inne')}</div>
          </div>
        </div>`;
    }

    function updateHero() {
      if (library.length === 0) return;
      const featured = library[Math.floor(Math.random() * library.length)];
      document.getElementById('heroTitle').textContent = featured.title;
      document.getElementById('heroDesc').textContent = featured.description || 'Oglądaj teraz w Viblo.';
    }

    // ========== ADMIN ==========
    function openAdmin() {
      document.getElementById('adminOverlay').classList.add('show');
      if (isAdmin) showAdminContent();
      else {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
        document.getElementById('adminEmail').value = '';
        document.getElementById('adminPassword').value = '';
        setTimeout(() => document.getElementById('adminEmail').focus(), 100);
      }
    }

    function closeAdmin() { document.getElementById('adminOverlay').classList.remove('show'); }

    async function checkCode() {
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      if (!email || !password) { toast('Wpisz e-mail i hasło.'); return; }
      const button = document.querySelector('#loginForm .btn-primary');
      button.disabled = true;
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        isAdmin = !!data.user;
        updateAdminButton();
        showAdminContent();
        toast('Zalogowano do panelu administratora');
      } catch (error) {
        console.error('Błąd logowania:', error);
        toast('Nie udało się zalogować. Sprawdź dane administratora.');
      } finally { button.disabled = false; }
    }

    async function logoutAdmin() {
      const { error } = await supabaseClient.auth.signOut();
      if (error) console.error(error);
      isAdmin = false;
      document.getElementById('adminContent').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('adminPassword').value = '';
      updateAdminButton();
      toast('Wylogowano z panelu administratora');
    }

    document.getElementById('adminPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkCode();
    });

    function toggleSeriesFields() {
      const isSeries = document.getElementById('type').value === 'series';
      document.getElementById('seriesFields').style.display = isSeries ? 'grid' : 'none';
    }

    async function addItem(e) {
      e.preventDefault();
      if (!isAdmin) { toast('Zaloguj się jako administrator.'); return; }
      const item = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: document.getElementById('title').value.trim(),
        type: document.getElementById('type').value,
        category: document.getElementById('category').value || 'Inne',
        year: document.getElementById('year').value || null,
        season: document.getElementById('season').value || null,
        episode: document.getElementById('episode').value || null,
        videoLink: document.getElementById('videoLink').value.trim(),
        poster: document.getElementById('poster').value.trim() || null,
        description: document.getElementById('description').value.trim() || '',
        addedAt: new Date().toISOString()
      };
      library.unshift(item);
      try {
        await save();
        document.getElementById('addForm').reset();
        toggleSeriesFields();
        renderLibrary();
        updateHero();
        toast(`Dodano: ${item.title}`);
      } catch (error) {
        library.shift();
        console.error('Błąd zapisu:', error);
        toast('Nie udało się zapisać. Sprawdź uprawnienia Supabase.');
      }
    }

    async function deleteItem(id) {
      if (!isAdmin) { toast('Brak uprawnień.'); return; }
      const item = library.find(i => i.id === id);
      const name = item ? item.title : 'ten tytuł';
      if (!confirm(`Na pewno chcesz usunąć „${name}”?`)) return;
      const previous = library;
      library = library.filter(i => i.id !== id);
      try {
        await save();
        renderLibrary();
        updateAdminList();
        toast('Usunięto: ' + name);
      } catch (error) {
        library = previous;
        console.error('Błąd usuwania:', error);
        toast('Nie udało się usunąć pozycji.');
      }
    }

    function updateAdminList() {
      const list = document.getElementById('adminList');
      const count = document.getElementById('count');
      if (!list) return;
      count.textContent = library.length;
      if (library.length === 0) {
        list.innerHTML = '<p style="color:#666;font-size:14px">Brak pozycji</p>';
        return;
      }
      list.innerHTML = library.map(item => {
        const meta = item.type === 'series'
          ? `Serial • S${item.season || '?'}E${item.episode || '?'}`
          : `Film${item.year ? ' • ' + item.year : ''}`;
        return `
          <div class="admin-item">
            <div class="admin-item-info">
              <strong>${escapeHtml(item.title)}</strong>
              <small>${escapeHtml(item.category || 'Inne')} • ${meta}</small>
            </div>
            <button class="delete-btn" onclick="deleteItem('${item.id}')"><i class="fas fa-trash"></i></button>
          </div>`;
      }).join('');
    }

    // ========== PLAYER / DETAILS ==========
    function openItem(id) {
      const item = library.find(i => i.id === id);
      if (!item) return;

      const body = document.getElementById('modalBody');
      const rawLink = (item.videoLink || '').trim();
      let playerHTML = '';

      // Odtwarzanie zawsze wewnątrz Viblo: natywne wideo albo osadzony player.
      const ytMatch = rawLink.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      const vimeoMatch = rawLink.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      const dmMatch = rawLink.match(/dailymotion\.com\/(?:video\/|embed\/video\/)([a-zA-Z0-9]+)/);
      const driveMatch = rawLink.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      // MEGA nie udostępnia zwykłego adresu MP4: plik jest szyfrowany,
      // a odtwarzanie odbywa się przez oficjalny player /embed/ z kluczem po #.
      const megaMatch = rawLink.match(/^https?:\/\/(?:www\.)?mega\.nz\/(?:file|embed)\/([^/?#]+)(?:#(.+))?$/i);

      if (megaMatch) {
        const megaEmbedUrl = `https://mega.nz/embed/${megaMatch[1]}${megaMatch[2] ? '#' + megaMatch[2] : ''}`;
        playerHTML = `<div class="player-wrapper"><iframe src="${escapeHtml(megaEmbedUrl)}" title="${escapeHtml(item.title)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe></div>`;
      } else if (ytMatch) {
        playerHTML = `<div class="player-wrapper"><iframe src="https://www.youtube-nocookie.com/embed/${ytMatch[1]}?autoplay=1" title="${escapeHtml(item.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
      } else if (vimeoMatch) {
        playerHTML = `<div class="player-wrapper"><iframe src="https://player.vimeo.com/video/${vimeoMatch[1]}" title="${escapeHtml(item.title)}" allow="autoplay; picture-in-picture" allowfullscreen></iframe></div>`;
      } else if (dmMatch) {
        playerHTML = `<div class="player-wrapper"><iframe src="https://www.dailymotion.com/embed/video/${dmMatch[1]}" title="${escapeHtml(item.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
      } else if (driveMatch) {
        playerHTML = `<div class="player-wrapper"><iframe src="https://drive.google.com/file/d/${driveMatch[1]}/preview" title="${escapeHtml(item.title)}" allow="autoplay" allowfullscreen></iframe></div>`;
      } else if (/^https?:\/\//i.test(rawLink) && /\.(mp4|webm|ogg|m4v)(?:[?#].*)?$/i.test(rawLink)) {
        playerHTML = `<div class="player-wrapper"><video controls autoplay playsinline preload="metadata" src="${escapeHtml(rawLink)}"></video></div>`;
      } else if (/^https?:\/\//i.test(rawLink)) {
        // Dla innych serwisów próbujemy osadzić ich stronę/player w oknie Viblo.
        // Nie otwieramy nowej karty ani nie przekierowujemy użytkownika.
        playerHTML = `<div class="player-wrapper"><iframe src="${escapeHtml(rawLink)}" title="${escapeHtml(item.title)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe></div>
          <p class="embed-note">Jeśli odtwarzacz się nie wyświetla, ten serwis blokuje osadzanie filmu. Użyj bezpośredniego linku MP4 albo linku „Udostępnij / Embed”.</p>`;
      } else {
        playerHTML = `<div class="embed-note">Brak prawidłowego linku do odtwarzania. Dodaj link do filmu w panelu administracyjnym.</div>`;
      }

      const meta = item.type === 'series'
        ? `Serial • Sezon ${item.season || '?'} • Odcinek ${item.episode || '?'}${item.year ? ' • ' + item.year : ''}`
        : `Film${item.year ? ' • ' + item.year : ''}`;

      const posterHTML = item.poster
        ? `<img class="modal-poster" src="${escapeHtml(item.poster)}" alt="${escapeHtml(item.title)}" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
        : '';

      body.innerHTML = `
        ${playerHTML}
        <div class="modal-info">
          <div class="modal-detail-row">
            ${posterHTML}
            <div class="modal-detail-text">
              <h2>${escapeHtml(item.title)}</h2>
              <div class="modal-meta">${escapeHtml(meta)} • ${escapeHtml(item.category || 'Inne')}</div>
              <p class="modal-desc">${escapeHtml(item.description || 'Brak opisu.')}</p>
            </div>
          </div>
        </div>`;

      document.getElementById('modal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      document.getElementById('modalBody').innerHTML = '';
      document.body.style.overflow = '';
    }

    function playRandom() {
      if (library.length === 0) {
        toast('Najpierw dodaj coś do biblioteki');
        return;
      }
      const item = library[Math.floor(Math.random() * library.length)];
      openItem(item.id);
    }

    function showHome() {
      document.getElementById('searchInput').value = '';
      renderLibrary();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ========== UTILS ==========
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Close modal on Escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal();
        closeAdmin();
      }
    });

    // Close overlays on background click
    document.getElementById('adminOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('adminOverlay')) closeAdmin();
    });
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });
  </script>
</body>
</html>
